name: Build Android APK (CI/CD)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          build-root-directory: vstep_android
          arguments: assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output-apk
          cp vstep_android/app/build/outputs/apk/debug/*.apk output-apk/VolStepTerminal-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolStepTerminal-Debug-APK
          path: output-apk/VolStepTerminal-debug.apk
          retention-days: 14
