name: Build Android APK (CI/CD)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          cd vstep_android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd vstep_android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd vstep_android
          ./gradlew assembleRelease --stacktrace || true

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output-apk
          cp vstep_android/app/build/outputs/apk/debug/*.apk output-apk/VolStepTerminal-debug.apk || true
          cp vstep_android/app/build/outputs/apk/release/*.apk output-apk/VolStepTerminal-release-unsigned.apk 2>/dev/null || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolStepTerminal-Debug-APK
          path: output-apk/VolStepTerminal-debug.apk
          retention-days: 14
