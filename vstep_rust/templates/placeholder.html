<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - VolStep Terminal</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme placeholder-page">
    <div class="placeholder-container">
        <div class="card placeholder-card">
            <div class="placeholder-icon">{{ icon }}</div>
            <h1 class="placeholder-title">{{ title }}</h1>
            <p class="placeholder-desc">{{ description }}</p>
            <div class="placeholder-badge">Dalam Pengembangan (Coming Soon)</div>
            <div class="placeholder-actions">
                <a href="/" class="btn btn-primary">
                    <span class="btn-icon">←</span> Kembali ke Menu Utama
                </a>
            </div>
        </div>
    </div>
</body>
</html>
