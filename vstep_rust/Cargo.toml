[package]
name = "vstep_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
url = "2.5"
chrono = "0.4"
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
